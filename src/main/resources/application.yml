spring:
  application:
    name: filmae-back-end
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/filmae_db}
    username: ${DATABASE_USERNAME:filmae_user}
    password: ${DATABASE_PASSWORD:filmae_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 20
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: 8080
  tomcat:
    # O Axios envia arrays como genres[]=Drama sem codificar os colchetes (GET /movies).
    relaxed-query-chars: ['[', ']']
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

jwt:
  # Mesmo segredo do auth-microservice (HS512 exige >= 64 bytes).
  secret: ${JWT_SECRET:}
  issuer: auth-service

auth-service:
  base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}
  connect-timeout: 3s
  read-timeout: 10s

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}

info:
  app:
    name: filmae-back-end
    version: 1.0.0
    environment: ${SPRING_PROFILES_ACTIVE:default}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.filmae: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
